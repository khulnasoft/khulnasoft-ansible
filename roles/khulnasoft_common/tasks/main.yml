---
- include_tasks: get_facts.yml

- include_tasks: install_python_requirements.yml

- include_tasks: change_khulnasoft_directory_owner.yml
  when:
    - ansible_system is match("Linux")
    - khulnasoft_home_ownership_enforcement is defined
    - khulnasoft_home_ownership_enforcement | bool

- include_tasks: update_etc.yml
  register: etc_updated
  when:
    - ansible_system is match("Linux")
    - khulnasoft.build_location is none or khulnasoft.build_location is not match("^(https?|file)://.*")

- include_tasks: stop_khulnasoft.yml
  when:
    - khulnasoft_upgrade | bool or etc_updated is changed

# Below we will either install or upgrade, which at this moment is the same task.
- name: "Install Khulnasoft"
  include_tasks: install_khulnasoft.yml
  when:
    - khulnasoft_install | bool or (first_run | bool and khulnasoft.build_location and khulnasoft.build_location is match("^(https?|file)://.*"))

- name: "Upgrade Khulnasoft"
  include_tasks: install_khulnasoft.yml
  when:
    - not khulnasoft_install
    - not first_run
    - khulnasoft_upgrade | bool
    - khulnasoft.allow_upgrade is defined
    - khulnasoft.allow_upgrade | bool

- include_tasks: enable_asan.yml
  when:
    - "'asan' in khulnasoft and khulnasoft.asan | bool"

- include_tasks: remove_first_login.yml

- include_tasks: install_java.yml
  when:
    - java_version is defined and java_version

# This needs to be done before any encrypted passkeys are generated, and before first call to khulnasoft status
- include_tasks: set_khulnasoft_secret.yml

- include_tasks: set_general_symmkey_password.yml
  when: "'pass4SymmKey' in khulnasoft and khulnasoft.pass4SymmKey"

- include_tasks: enable_admin_auth.yml

- include_tasks: configure_mgmt_port.yml

- include_tasks: set_launch_conf.yml
  when:
    - "'launch' in khulnasoft and khulnasoft.launch"

- include_tasks: pre_khulnasoft_start_commands.yml
  ignore_errors: true

- include_tasks: enable_s2s.yml
  when:
    - "('s2s_enable' in khulnasoft) or ('s2s' in khulnasoft and 'enable' in khulnasoft.s2s)"
    - "('s2s_port' in khulnasoft and khulnasoft.s2s_port) or ('s2s' in khulnasoft and 'port' in khulnasoft.s2s and khulnasoft.s2s.port)"

- include_tasks: enable_service.yml
  when:
    - khulnasoft.enable_service and ansible_system is match("Linux")
    - first_run | bool

- include_tasks: set_http_port.yml
  when:
    - "'http_port' in khulnasoft"
    - khulnasoft.http_port | int != 8000

- include_tasks: set_mgmt_port.yml

- include_tasks: set_root_endpoint.yml
  when: "'root_endpoint' in khulnasoft and khulnasoft.root_endpoint"

- include_tasks: set_appserver_port.yml
  when:
    - "'appserver' in khulnasoft and 'port' in khulnasoft.appserver"
    - khulnasoft.appserver.port | int != 8065

- include_tasks: set_kvstore_port.yml
  when:
    - "'kvstore' in khulnasoft and 'port' in khulnasoft.kvstore"
    - khulnasoft.kvstore.port | int != 8191

- include_tasks: enable_khulnasoftweb_ssl.yml
  when:
    - "'http_enableSSL' in khulnasoft and khulnasoft.http_enableSSL is not none"
    - khulnasoft.http_enableSSL | bool

- include_tasks: enable_khulnasoftd_ssl.yml
  when: "'ssl' in khulnasoft and khulnasoft.ssl"

- include_tasks: set_khulnasoft_connection_timeout.yml
  when:
    - "'connection_timeout' in khulnasoft and khulnasoft.connection_timeout"
    - khulnasoft.connection_timeout | int > 0

- include_tasks: set_config_file.yml
  vars:
    conf_file: "{{ item.key }}.conf"
    conf_directory: "{{ item.value.directory | default(khulnasoft.home + '/etc/system/local', true) }}"
    conf_stanzas: "{{ item.value.content | default({}) }}"
  with_items: "{% if khulnasoft.conf is mapping %}{{ khulnasoft.conf | dict2items }}{% else %}{{ khulnasoft.conf }}{% endif %}"
  when: "'conf' in khulnasoft and khulnasoft.conf"
  no_log: "{{ hide_password }}"

# Generate outputs.conf before khulnasoft starts to prevent data being indexed locally
- include_tasks: enable_forwarding.yml
  when:
    # Indexers should never forward 
    - khulnasoft.role != "khulnasoft_indexer"
    - (khulnasoft.role != "khulnasoft_standalone" and khulnasoft.role != "khulnasoft_search_head") or
        (khulnasoft_indexer_cluster | bool or khulnasoft_forward_servers is defined)

- include_tasks: enable_dsp.yml
  when: "'dsp' in khulnasoft and 'enable' in khulnasoft.dsp and khulnasoft.dsp.enable"

- include_tasks: start_khulnasoft.yml

- include_tasks: set_certificate_prefix.yml
  when: not uds_enabled | bool

- include_tasks: clean_user_seed.yml

- include_tasks: add_khulnasoft_license.yml

- include_tasks: disable_popups.yml
  when: "'disable_popups' in khulnasoft and khulnasoft.disable_popups | bool"

- include_tasks: check_mgmt_mode_status.yml
  when: khulnasoft.role == "khulnasoft_universal_forwarder"
