---
# Choose privileged username for current OS
- name: "Set privilege escalation user"
  set_fact:
    privileged_user: "{% if ansible_system is match('CYGWIN*|Win32NT') %}Administrator{% else %}root{% endif %}"

# Check if SCS CLI is available
- name: "Check for scloud"
  stat:
    path: /usr/bin/scloud
  register: scloudcli
  changed_when: False

# Check if systemd is running
- name: "Identify service system (Linux)"
  command: "ps --no-headers -o comm 1"
  register: pid1
  changed_when: False
  when: khulnasoft.enable_service and ansible_system is match("Linux")

- name: "Set systemd boolean"
  set_fact:
    khulnasoft_systemd: "{{ pid1.stdout.find('systemd') != -1 }}"
  when:
    - khulnasoft.enable_service
    - ansible_system is match("Linux")

# If there is no Khulnasoft executable, we will need to install.
- name: "Check for existing installation"
  stat:
    path: "{{ khulnasoft.exec }}"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: pre_existing_khulnasoft_exec

- name: "Set khulnasoft install fact"
  set_fact:
    khulnasoft_install: "{{ not pre_existing_khulnasoft_exec.stat.exists | default(True) }}"

# We know if this is the first time we are executing Khulnasoft by checking if a khulnasoft.secret file exists.
# Since running the software will generate this and we assume nobody will delete the khulnasoft.secret.
- name: "Check for existing khulnasoft secret"
  stat:
    path: "{{ khulnasoft.home }}/etc/auth/khulnasoft.secret"
  register: pre_existing_khulnasoft_secret
  become: yes
  become_user: "{{ khulnasoft.user }}"

- name: "Set first run fact"
  set_fact:
    first_run: "{{ not pre_existing_khulnasoft_secret.stat.exists | default(True) }}"

- name: "Set khulnasoft_build_type fact"
  include_tasks: get_facts_build_type.yml

- name: "Set target version fact"
  include_tasks: get_facts_target_version.yml
  when: khulnasoft_target_version is not defined or khulnasoft_target_version == none

# We can apply the same logic to the current version by checking which manifest file is in Khulnasoft
- name: "Find manifests"
  find:
    paths: "{{ khulnasoft.home }}"
    patterns: ".*-manifest$"
    use_regex: yes
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: manifests

- name: "Set current version fact"
  set_fact:
    khulnasoft_current_version: "{{ manifests.files[0].path | regex_search(regexp, '\\1') if (manifests.matched == 1) else '0' }}"
    khulnasoft_current_build_hash: "{{ manifests.files[0].path | regex_search(regexp, '\\3') if (manifests.matched == 1) else '0' }}"
    khulnasoft_target_build_hash: "{{ khulnasoft.build_location | string | regex_search(regexp, '\\3') | default('0') }}"
  vars:
    regexp: 'khulnasoft\D*?-(\d+\.\d+\.\d+(\.\d+)?)-(.*?)-.*?'

# We are upgrading if it is not a fresh installation and the current version is different from the target version,
# and allowing upgrades between new and old hashes of the same version.
- name: "Setting upgrade fact"
  set_fact:
    khulnasoft_upgrade: "{{ not first_run and 'build_location' in khulnasoft and khulnasoft.build_location and not khulnasoft_install and khulnasoft_target_version and ((khulnasoft_target_version != khulnasoft_current_version) or (khulnasoft_current_build_hash != khulnasoft_target_build_hash))| default(False) }}"

# determine if we need to set up indexer clusters
- name: "Setting indexer cluster fact from config"
  set_fact:
    khulnasoft_indexer_cluster: "{{ True if 'cluster_master_url' in khulnasoft and khulnasoft.cluster_master_url else False }}"

# determine if we need to set up search head clusters
- name: "Setting search head cluster fact from config"
  set_fact:
    khulnasoft_search_head_cluster: "{{ True if 'search_head_captain_url' in khulnasoft and khulnasoft.search_head_captain_url else False }}"

# determine if we need to set up forward servers
# First, if they are manually specified in the config, use them
- name: "Setting forward servers fact from config"
  set_fact:
    khulnasoft_forward_servers: "{{ khulnasoft.forward_servers }}"
  when:
    - "'forward_servers' in khulnasoft"

# If not in the config, is there an index cluster to use?
# Configure forwarding to indexers directly
# See: https://docs.khulnasoft.com/Documentation/Khulnasoft/latest/Indexer/forwardersdirecttopeers
- name: "Setting forward servers fact from index cluster group"
  set_fact:
    khulnasoft_forward_servers: "{{ groups['khulnasoft_indexer'] | difference([ansible_hostname]) }}"
  when:
    - "khulnasoft_forward_servers is not defined"
    - "'khulnasoft_indexer' in groups"
    # Prevent self-forwarding
    - khulnasoft.role != "khulnasoft_indexer"

# if not specified in config *and*
# no index clusters, then look for standalone
# See: https://docs.khulnasoft.com/Documentation/Khulnasoft/latest/Indexer/forwardersdirecttopeers
- name: "Setting forward servers fact from standalone group"
  set_fact:
    khulnasoft_forward_servers: "{{ groups['khulnasoft_standalone'] | difference([ansible_hostname]) }}"
  when:
    - "khulnasoft_forward_servers is not defined"
    - "'khulnasoft_standalone' in groups"
    # Prevent self-forwarding
    - khulnasoft.role != "khulnasoft_standalone"
    # This part takes a little explaining.  If we have a mixed cluster with no indexers
    # (Only standalone and search heads) we should not automatically forward the data to
    # standalone instances UNLESS they are specified by forward-servers
    - "'khulnasoft_search_head' not in groups"

# Usually we can auto detect what the service name should be, but sometimes
# we want to manually specify it. This is where we detect it was manually set.
- name: "Detect service name"
  include_tasks: get_facts_service_name.yml
