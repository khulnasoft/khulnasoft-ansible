---
- include_tasks: ../../../roles/khulnasoft_common/tasks/wait_for_khulnasoft_instance.yml
  vars:
    khulnasoft_instance_address: "{{ khulnasoft.cluster_master_url }}"

- name: Set current node as indexer cluster peer
  command: "{{ khulnasoft.exec }} edit cluster-config -mode slave -master_uri '{{ cert_prefix }}://{{ khulnasoft.cluster_master_url }}:{{ khulnasoft.svc_port }}' -replication_port {{ khulnasoft.idxc.replication_port }} -secret '{{ khulnasoft.idxc.pass4SymmKey }}' -auth '{{ khulnasoft.admin_user }}:{{ khulnasoft.password }}'"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: task_result
  changed_when: task_result.rc == 0
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  ignore_errors: yes
  notify:
    - Restart the khulnasoftd service
  no_log: "{{ hide_password }}"
