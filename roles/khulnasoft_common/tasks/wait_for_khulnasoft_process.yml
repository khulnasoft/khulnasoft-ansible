---
- name: Wait for Khulnasoft process to be running
  wait_for:
    path: "{{ khulnasoft.pid }}"
    state: present
  when: ansible_system is match("Linux")

- name: Wait for the Khulnasoft service port to be available
  wait_for:
    host: 127.0.0.1
    port: "{{ khulnasoft.svc_port }}"
    timeout: 180
  when: not uds_enabled | bool
