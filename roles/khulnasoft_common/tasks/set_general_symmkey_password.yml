- name: Set general pass4SymmKey
  ini_file:
    dest: "{{ khulnasoft.home }}/etc/system/local/server.conf"
    section: "general"
    option: "pass4SymmKey"
    value: "{{ khulnasoft.pass4SymmKey }}"
    owner: "{{ khulnasoft.user }}"
    group: "{{ khulnasoft.group }}"
  register: set_symmkey
  no_log: "{{ hide_password }}"

- include_tasks: trigger_restart.yml
  when: set_symmkey is changed
