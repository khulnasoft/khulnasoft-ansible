---
- name: Install Khulnasoftbase app
  khulnasoft_api:
    method: POST
    url: /services/apps/local
    cert_prefix: "{{ cert_prefix }}"
    username: "{{ khulnasoft.admin_user }}"
    password: "{{ khulnasoft.password }}"
    svc_port: "{{ khulnasoft.svc_port }}"
    body:
      name: "{{ app_url }}"
      update: "true"
      filename: "true"
      auth: "{{ khulnasoftbase_token }}"
    body_format: "form-urlencoded"
    status_code: 200,201
    timeout: 300
  when:
    - app_url is defined
    - "'khulnasoftbase.khulnasoft.com' in app_url"
    - khulnasoftbase_token is defined
    - khulnasoftbase_token != None
  no_log: "{{ hide_password }}"

- name: Install generic app
  when: "'khulnasoftbase.khulnasoft.com' not in app_url"
  block:
  - name: Check local app
    stat:
      path: "{{ app_url }}"
    register: app_local

  - name: Download remote app
    get_url:
      url: "{{ app_url }}"
      dest: /tmp/
      mode: 0777
      timeout: 120
      force: yes
      url_username: "{{ khulnasoft.artifact_auth_user }}"
      url_password: "{{ khulnasoft.artifact_auth_pass }}"
    register: app_remote
    when:
      - app_url is match("^(https?|file)://.*")

  - name: Infer app filepath
    set_fact:
      app_filepath: "{% if app_url | regex_search('^(https?|file)://.*') %}{{ app_remote.dest }}{% else %}{{ app_local.stat.path }}{% endif %}"

  # ITSI require installation via extraction - others can be installed normally.
  # Verify the contents of the package and check for ITSI
  - name: Check app contents
    shell: "set -o pipefail && tar --exclude='*/*/*' --exclude='*.*' -tf {{ app_filepath }} | awk -F'/' '{ print$1 }' | uniq"
    args:
      executable: /bin/bash
    register: app_contents
    changed_when: false
    when: "'khulnasoftbase.khulnasoft.com' not in app_url"

  - name: Install app via extraction
    unarchive:
      src: "{{ app_filepath }}"
      dest: "{{ khulnasoft.app_paths.default }}"
      remote_src: true
    become: yes
    become_user: "{{ khulnasoft.user }}"
    no_log: "{{ hide_password }}"
    when:
      - "'itsi' in app_contents.stdout_lines or 'DA-ITSI-ContentLibrary' in app_contents.stdout_lines"
      - app_remote is changed or app_local.stat.exists
    notify:
      - Restart the khulnasoftd service

  - name: Install app via REST
    khulnasoft_api:
      method: POST
      url: "/services/apps/local"
      cert_prefix: "{{ cert_prefix }}"
      username: "{{ khulnasoft.admin_user }}"
      password: "{{ khulnasoft.password }}"
      svc_port: "{{ khulnasoft.svc_port }}"
      body:
        name: "{{ app_filepath }}"
        update: "true"
        filename: "true"
      status_code: 200,201
      timeout: 90
      body_format: "form-urlencoded"
    register: post_apps_local
    until: post_apps_local is succeeded
    retries: 5
    delay: "{{ retry_delay }}"
    changed_when: post_apps_local.status == 201
    when:
      - "'itsi' not in app_contents.stdout_lines"
      - "'DA-ITSI-ContentLibrary' not in app_contents.stdout_lines"
      - app_remote is changed or app_local.stat.exists
    no_log: "{{ hide_password }}"
