---
- name: Prepare
  hosts: all
  tasks:
    - name: Check khulnasoft user
      user:
        name: khulnasoft
        password: "*"
        state: present
      become: true

    - name: Check packages
      package:
        name:
          - procps
          - curl
          - net-tools
        state: latest

    - name: Make container_artifact dir
      file:
        path: /opt/container_artifact
        state: directory
        mode: 0777
