- name: Deploy UDS configuration
  copy:
    src: ../../../roles/khulnasoft_universal_forwader/uds_inputs.conf
    dest: "{{ khulnasoft.home }}/etc/apps/your_app/local/uds_inputs.conf"
    owner: "{{ khulnasoft.user }}"
    group: "{{ khulnasoft.group }}"
    mode: 0644
  notify: restart khulnasoft
  when: uds_enabled | bool