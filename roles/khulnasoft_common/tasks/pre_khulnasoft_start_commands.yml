---
# TODO: This looks a lot like add_khulnasoft_object.yml - we can probably condense this
- name: Execute pre-start Khulnasoft commands
  command: "{{ khulnasoft.exec }} {{ item }} -auth {{ khulnasoft.admin_user }}:{{ khulnasoft.password }} --accept-license --answer-yes --no-prompt"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  with_items: "{{ khulnasoft.before_start_cmd }}"
  when: khulnasoft.before_start_cmd is defined
  register: task_result
  until: task_result.rc == 0 or "already exists" in task_result.stderr
  changed_when: task_result.rc == 0
  failed_when:
    - task_result.rc != 0
    - "'already exists' not in task_result.stderr"
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  ignore_errors: true
  no_log: "{{ hide_password }}"
  notify:
    - Restart the khulnasoftd service
