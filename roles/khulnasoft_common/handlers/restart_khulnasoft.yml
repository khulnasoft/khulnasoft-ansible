---
- name: "Restart the khulnasoftd service - Via CLI"
  command: "{{ khulnasoft.exec }} restart --answer-yes --accept-license"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: task_result
  until: task_result.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ restart_retry_delay }}"
  when: not khulnasoft.enable_service

- name: "Restart the khulnasoftd service - Via Linux systemd or init"
  service:
    name: "{{ khulnasoft_service_name }}"
    state: restarted
  when: khulnasoft.enable_service and ansible_system is match("Linux")
  become: yes
  become_user: "{{ privileged_user }}"

- name: "Restart the khulnasoftd service - Via windows system"
  win_service:
    name: "{{ khulnasoft_service_name }}"
    state: restarted
  when: khulnasoft.enable_service and not ansible_system is match("Linux")

- include_tasks: ../tasks/check_uds_file.yml

- name: "Wait for khulnasoftd management port"
  wait_for:
    port: "{{ khulnasoft.svc_port }}"
  when: not uds_enabled | bool
