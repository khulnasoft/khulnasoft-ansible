---
- name: Install Khulnasoftbase app
  khulnasoft_api:
    method: POST
    url: /services/apps/local
    cert_prefix: "{{ cert_prefix }}"
    username: "{{ khulnasoft.admin_user }}"
    password: "{{ khulnasoft.password }}"
    svc_port: "{{ khulnasoft.svc_port }}"
    body:
      name: "{{ app_filepath }}"
      update: "true"
      filename: "true"
      auth: "{{ khulnasoftbase_token }}"
    body_format: "form-urlencoded"
    status_code: [200,201]
    timeout: 300
  when:
    - app_filepath is defined
    - "'khulnasoftbase.khulnasoft.com' in app_filepath"
    - khulnasoftbase_token is defined
    - khulnasoftbase_token != None
  no_log: "{{ hide_password }}"

- name: Install via app_paths
  when: "'khulnasoftbase.khulnasoft.com' not in app_filepath"
  block:
  - name: Check local app
    stat:
      path: "{{ app_filepath }}"
    register: app_local
  - name: Download remote app
    get_url:
      url: "{{ app_filepath }}"
      dest: /tmp/
      mode: 0777
      timeout: 120
      force: yes
    register: app_remote
    when:
      - app_filepath is match("^(https?|file)://.*")

  - name: Infer app filepath
    set_fact:
      app_install_filepath: "{% if app_filepath | regex_search('^(https?|file)://.*') %}{{ app_remote.dest }}{% else %}{{ app_local.stat.path }}{% endif %}"

  - name: Extract app to location
    unarchive:
      src: "{{ app_install_filepath }}"
      dest: "{{ extract_path }}"
      remote_src: true
    become: yes
    become_user: "{{ khulnasoft.user }}"
    no_log: "{{ hide_password }}"
    when:
      - app_install_filepath is defined

