---
- include_tasks: ../../../roles/khulnasoft_common/tasks/provision_apps.yml
  when:
    - "'apps_location' in khulnasoft and khulnasoft.apps_location"
    - khulnasoft.deployment_server is not defined or not khulnasoft.deployment_server
  vars:
    app_list: "{{ khulnasoft.apps_location }}"

- include_tasks: ../../../roles/khulnasoft_common/tasks/set_as_deployment_client.yml
  when: khulnasoft.deployment_server is defined and khulnasoft.deployment_server

- include_tasks: prepare_apps_bundle.yml
  when: "'apps_location' in khulnasoft and khulnasoft.apps_location"

- include_tasks: initialize_cluster_master.yml

- include_tasks: ../../../roles/khulnasoft_common/tasks/extract_app.yml
  when: "'app_paths_install' in khulnasoft and 'idxc' in khulnasoft.app_paths_install and khulnasoft.app_paths_install.idxc"
  vars:
    app_filepath: "{{ item }}"
    extract_path: "{{ khulnasoft.app_paths.idxc }}"
  loop: "{{ khulnasoft.app_paths_install.idxc }}"

- include_tasks: apply_cluster_bundle.yml

# This installed_apps list gets mutated by ESS bundle generation, hence we
# need to refresh this array of apps before disabling them all
- include_tasks: ../../../roles/khulnasoft_common/tasks/find_installed_apps.yml
  when: "'apps_location' in khulnasoft and khulnasoft.apps_location"

- include_tasks: ../../../roles/khulnasoft_common/tasks/disable_installed_apps.yml
  when: "'apps_location' in khulnasoft and khulnasoft.apps_location"

# Now install local apps in apps_location_local exists
- include_tasks: ../../../roles/khulnasoft_common/tasks/provision_apps.yml
  when:
    - "'apps_location_local' in khulnasoft and khulnasoft.apps_location_local"
  vars:
    app_list: "{{ khulnasoft.apps_location_local }}"

- include_tasks: ../../roles/khulnasoft_common/tasks/provision_apps.yml
  when:
    - "'app_paths_install' in khulnasoft and 'default' in khulnasoft.app_paths_install and khulnasoft.app_paths_install.default"
  vars:
    app_list: "{{ khulnasoft.app_paths_install.default }}"

- include_tasks: setup_multisite.yml
  when:
    - khulnasoft.site is defined
    - khulnasoft.all_sites is defined
    - khulnasoft.multisite_replication_factor_origin is defined
    - khulnasoft.multisite_replication_factor_total is defined
    - khulnasoft.multisite_search_factor_origin is defined
    - khulnasoft.multisite_search_factor_total is defined

- include_tasks: ../../../roles/khulnasoft_common/tasks/check_for_required_restarts.yml

