- name: Install Khulnasoft (Windows)
  command: "msiexec /I {{ khulnasoft.build_location }} AGREETOLICENSE=yes LAUNCHKHULNASOFT=0 INSTALLDIR=C:\\\\opt\\\\{{ khulnasoft.tar_dir }} /passive /qn"
  when: ansible_system is match("CYGWIN*|Win32NT")
  register: install_result
  until: install_result is succeeded
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
