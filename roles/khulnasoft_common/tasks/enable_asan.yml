---
- name: Check version of ASan
  stat:
    path: "{{ khulnasoft.home }}/lib/libasan.so.5.0.0"
  register: result

- name: Copy new ASan libraries
  copy:
    src: "{{ khulnasoft.home }}/lib/{{ item }}"
    dest: "{{'/lib' if ansible_facts['os_family'] == 'Debian' else '/lib64'}}/{{ item }}"
    remote_src: yes
    mode: 0755
  when: result.stat.exists
  with_items:
    - libasan.so
    - libasan.so.5
    - libasan.so.5.0.0
  become: yes
  become_user: "{{ privileged_user }}"

- name: Copy old ASan libraries
  copy:
    src: "{{ khulnasoft.home }}/lib/{{ item }}"
    dest: "{{'/lib' if ansible_facts['os_family'] == 'Debian' else '/lib64'}}/{{ item }}"
    remote_src: yes
    mode: 0755
  when: not result.stat.exists
  with_items:
    - libasan.so
    - libssp.so.0
    - libasan.so.2
    - libasan.so.2.0.0
  become: yes
  become_user: "{{ privileged_user }}"

- name: Create ASan output directory
  file:
    path: "{{ khulnasoft.home }}/_asanoutput"
    state: directory
    owner: "{{ khulnasoft.user }}"
    group: "{{ khulnasoft.group }}"
  become: yes
  become_user: "{{ khulnasoft.user }}"
