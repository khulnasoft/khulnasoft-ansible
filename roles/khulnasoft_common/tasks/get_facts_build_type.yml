- name: Set khulnasoft_build_type from variable
  set_fact:
    khulnasoft_build_type: "{{ khulnasoft.build_type }}"
  when:
    - "'build_type' in khulnasoft"
    - "khulnasoft.build_type is not none"

- name: Set khulnasoft_build_type from build_location
  block:
    #check if the build_location is a tgz
    - name: "Set build_type (tgz)"
      set_fact:
        khulnasoft_build_type: "tgz"
      when: khulnasoft.build_location is match(".*(\.tar\.gz|\.tgz)$")
    - name: "Set build_type (msi)"
      set_fact:
        khulnasoft_build_type: "msi"
      when: khulnasoft.build_location is match(".*\.msi$")
    #check if the build_location is a rpm
    - name: "Set build_type (rpm)"
      set_fact:
        khulnasoft_build_type: "rpm"
      when: khulnasoft.build_location is match(".*\.rpm$")
    #check if the build_location is a deb
    - name: "Set build_type (deb)"
      set_fact:
        khulnasoft_build_type: "deb"
      when: khulnasoft.build_location is match(".*\.deb$")
  when:
    - khulnasoft_build_type is not defined
    - khulnasoft_build_type is not none
    - khulnasoft.build_location is not none
