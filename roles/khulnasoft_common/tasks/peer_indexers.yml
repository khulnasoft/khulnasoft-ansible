---
- include_tasks: ../../../roles/khulnasoft_common/tasks/wait_for_khulnasoft_instance.yml
  vars:
    khulnasoft_instance_address: "{{ idx }}"

# INFRA-38882: Do I need to update this task as well?
- name: "Add {{ idx }} as search peer"
  command: "{{ khulnasoft.exec }} add search-server {{ cert_prefix }}://{{ idx }}:{{ khulnasoft.svc_port }} -auth {{ khulnasoft.admin_user }}:{{ khulnasoft.password }} -remoteUsername {{ khulnasoft.admin_user }} -remotePassword {{ khulnasoft.password }}"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: set_indexer_as_peer
  until: set_indexer_as_peer.rc == 0 or set_indexer_as_peer.rc == 24
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  changed_when: set_indexer_as_peer.rc == 0
  failed_when: set_indexer_as_peer.rc != 0 and 'already exists' not in set_indexer_as_peer.stderr
  notify:
    - Restart the khulnasoftd service
  no_log: "{{ hide_password }}"
