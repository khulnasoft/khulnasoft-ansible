---
- name: Set the Khulnasoft secret
  copy:
    dest: "{{ khulnasoft.home }}/etc/auth/khulnasoft.secret"
    owner: "{{ khulnasoft.user }}"
    group: "{{ khulnasoft.group }}"
    mode: 0400
    content: "{{ khulnasoft.secret }}"
  when:
    - khulnasoft.secret is defined
    - khulnasoft.secret
  become: yes
  become_user: "{{ khulnasoft.user }}"
