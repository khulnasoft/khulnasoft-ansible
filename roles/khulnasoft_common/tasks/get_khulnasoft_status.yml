---
- name: "Restrict permissions on khulnasoft.key for Status"
  include_tasks: restrict_permissions.yml
  vars:
    file_path: "{{ item }}"
  with_items:
    - "{{ khulnasoft.home }}/var/lib/khulnasoft/kvstore/mongo/khulnasoft.key"

- name: Get Khulnasoft status
  command: "{{ khulnasoft.exec }} status --accept-license --answer-yes --no-prompt"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: khulnasoft_status
  changed_when: False
  failed_when: False
  ignore_errors: yes
