---
- name: Initialize licenses array
  set_fact:
    licenses: []

- name: Determine available licenses
  set_fact:
    licenses: "{{ licenses + [ item ] }}"
  with_items: "{{ khulnasoft.license_uri.split(',') }}"
  when: khulnasoft.license_uri is defined and khulnasoft.license_uri

- name: Apply licenses
  include_tasks: apply_licenses.yml
  with_items:
    - "{{ licenses }}"
  loop_control:
    loop_var: license
  when:
    - licenses and licenses | length > 0
    - "not ('license_master_url' in khulnasoft and khulnasoft.license_master_url) or khulnasoft.role == 'khulnasoft_license_master'"

- name: Set as license slave
  include_tasks: set_as_license_slave.yml
  when:
    - "'license_master_url' in khulnasoft and khulnasoft.license_master_url"
    - khulnasoft.role != "khulnasoft_license_master"

- name: Flush handlers
  meta: flush_handlers
