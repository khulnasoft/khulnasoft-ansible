---
# Use wait_for_khulnasoft_process.yml for local (non-remote) instances
# This play does not support UDS endpoints on remote forwarders
- name: Check remote Khulnasoft instance is running
  uri:
    url: "{{ scheme | default(cert_prefix) }}://{{ khulnasoft_instance_address }}:{{ port | default(khulnasoft.svc_port) }}"
    method: GET
    validate_certs: false
    use_proxy: no
  register: task_response
  until:
    - task_response.status == 200
  retries: "{{ wait_for_khulnasoft_retry_num }}"
  delay: "{{ retry_delay }}"
  ignore_errors: true
  no_log: "{{ hide_password }}"
