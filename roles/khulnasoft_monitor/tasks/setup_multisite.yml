---
- include_tasks: ../../../roles/khulnasoft_common/tasks/wait_for_khulnasoft_instance.yml
  vars:
    khulnasoft_instance_address: "{{ khulnasoft.multisite_master }}"

- name: Convert Extrenal Cluster Master Name into Internal URI
  set_fact:
      multisite_master_uri: "{{ cert_prefix }}://{{ khulnasoft.multisite_master }}:{{ khulnasoft.svc_port }}"
#INFRA-38882: Update
- name: Setup SH - Multisite
  command: "{{ khulnasoft.exec }} edit cluster-config -mode searchhead -master_uri {{ multisite_master_uri }} -auth {{ khulnasoft.admin_user }}:{{ khulnasoft.password }} -secret {{ khulnasoft.idxc.pass4SymmKey }}"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: set_new_master
  until: set_new_master.rc == 0 or (set_new_master.rc != 0 and "Cannot edit this searchhead. Use 'khulnasoft edit cluster-master' to edit information for this searchhead." in set_new_master.stderr) or (set_new_master.rc != 0 and "Cannot edit this searchhead. Use 'khulnasoft edit cluster-manager' to edit information for this searchhead." in set_new_master.stderr)
  failed_when: (set_new_master.rc != 0 and "Cannot edit this searchhead. Use 'khulnasoft edit cluster-master' to edit information for this searchhead." not in set_new_master.stderr) or (set_new_master.rc != 0 and "Cannot edit this searchhead. Use 'khulnasoft edit cluster-manager' to edit information for this searchhead." not in set_new_master.stderr)
  changed_when: set_new_master.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  ignore_errors: yes
  notify:
    - Restart the khulnasoftd service
  no_log: "{{ hide_password }}"

- name: Flush restart handlers
  meta: flush_handlers

- include_tasks: ../../../roles/khulnasoft_common/tasks/wait_for_khulnasoft_process.yml

- name: Setup SH with Associated Site
  command: "{{ khulnasoft.exec }} edit cluster-master -old_master_uri {{ multisite_master_uri }} -site {{ khulnasoft.site }} -auth {{ khulnasoft.admin_user }}:{{ khulnasoft.password }} -secret {{ khulnasoft.idxc.pass4SymmKey }} -multisite True"
  become: yes
  become_user: "{{ khulnasoft.user }}"
  register: set_associated_site
  until: set_associated_site.rc == 0 or (set_associated_site.rc == 22 and 'No change in master or secret or site.' in set_associated_site.stderr) or (set_associated_site.rc == 22 and 'No change in manager or secret or site.' in set_associated_site.stderr)
  changed_when: set_associated_site.rc == 0
  retries: "{{ retry_num }}"
  delay: "{{ retry_delay }}"
  ignore_errors: yes
  notify:
    - Restart the khulnasoftd service
  no_log: "{{ hide_password }}"
  failed_when: (set_associated_site.rc != 0 and 'No change in master or secret or site.' not in set_associated_site.stderr) or (set_associated_site.rc != 0 and 'No change in manager or secret or site.' not in set_associated_site.stderr)
