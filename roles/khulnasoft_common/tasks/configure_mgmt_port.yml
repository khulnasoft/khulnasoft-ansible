---
- name: set version fact
  set_fact:
    installed_khulnasoft_version: "{{ lookup('file', '{{ khulnasoft.home }}/etc/khulnasoft.version') | regex_findall('VERSION=([0-9.]+)') | first }}"

- name: Configure to set Mgmt Mode as auto (Allows UDS)
  ini_file:
    dest: "{{ khulnasoft.home }}/etc/system/local/server.conf"
    option: "mgmtMode"
    section: "httpServer"
    value: "auto"
    owner: "{{ khulnasoft.user }}"
    group: "{{ khulnasoft.group }}"
  when:
    - khulnasoft.role == "khulnasoft_universal_forwarder"
    - not khulnasoft.khulnasoft_http_enabled | bool
    - installed_khulnasoft_version is version("9.1.0", ">=")
    - ansible_system is not match("CYGWIN*|Win32NT")

- name: Configure to set Mgmt Mode as tcp (Allows only TCP)
  ini_file:
    dest: "{{ khulnasoft.home }}/etc/system/local/server.conf"
    option: "mgmtMode"
    section: "httpServer"
    value: "tcp"
    owner: "{{ khulnasoft.user }}"
    group: "{{ khulnasoft.group }}"
  when:
    - khulnasoft.role == "khulnasoft_universal_forwarder"
    - khulnasoft.khulnasoft_http_enabled | bool or ansible_system is match("CYGWIN*|Win32NT")
    - installed_khulnasoft_version is version("9.1.0", ">=")
